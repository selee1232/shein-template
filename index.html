<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مولد تصاميم</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f4f1ed;
  margin:0;
  padding:20px;
}

.box{
  max-width:500px;
  margin:auto;
  background:white;
  padding:25px;
  border-radius:20px;
}

input,textarea,button{
  width:100%;
  margin:8px 0;
  padding:14px;
  box-sizing:border-box;
  font-size:18px;
}

textarea{
  height:130px;
}

button{
  background:#000;
  color:#fff;
  border:0;
  border-radius:12px;
  cursor:pointer;
}

canvas{
  width:100%;
  margin-top:15px;
  display:block;
}
</style>
</head>

<body>

<div class="box">

<h2>مولد التصميم</h2>

<input
  type="file"
  id="product"
  accept="image/*"
>

<textarea
  id="content"
  placeholder="العنوان
الوصف
رقم القطعة"></textarea>

<button onclick="make()">إنشاء التصميم</button>

<canvas
  id="canvas"
  width="1080"
  height="1920">
</canvas>

<button onclick="save()">حفظ التصميم</button>

</div>

<script>

const BG = "59CB9608-56BC-4AF8-AD94-46BA64874CB8.png";


function load(src){
  return new Promise((resolve,reject)=>{
    const img = new Image();

    img.onload = () => resolve(img);
    img.onerror = reject;

    img.src = src;
  });
}


function wrapText(ctx,text,maxWidth,maxLines){

  const words = text.trim().split(/\s+/);

  const lines = [];
  let line = "";

  for(const word of words){

    const testLine = line
      ? line + " " + word
      : word;

    if(
      ctx.measureText(testLine).width > maxWidth &&
      line
    ){
      lines.push(line);
      line = word;

      if(lines.length === maxLines - 1){
        break;
      }

    }else{
      line = testLine;
    }
  }

  if(line && lines.length < maxLines){
    lines.push(line);
  }

  return lines;
}


async function make(){

  try{

    const file =
      document.getElementById("product").files[0];

    if(!file){
      alert("اختر صورة المنتج");
      return;
    }


    const raw =
      document.getElementById("content").value
      .split("\n")
      .map(x => x.trim())
      .filter(Boolean);


    if(raw.length < 3){
      alert("اكتب العنوان والوصف ورقم القطعة");
      return;
    }


    const title = raw[0];

    const code = raw[raw.length - 1];

    const desc =
      raw.slice(1,-1).join(" ");


    const bg = await load(BG);

    const productURL =
      URL.createObjectURL(file);

    const product =
      await load(productURL);


    const canvas =
      document.getElementById("canvas");

    const x =
      canvas.getContext("2d");


    x.clearRect(0,0,1080,1920);

    x.drawImage(
      bg,
      0,
      0,
      1080,
      1920
    );


    /* العنوان */

    x.textAlign = "center";
    x.textBaseline = "middle";
    x.direction = "rtl";

    x.fillStyle = "#e91e63";
    x.font = "bold 58px Arial";

    x.fillText(
      title,
      540,
      300
    );


    /* الوصف - يقسم تلقائياً حتى 3 أسطر */

    x.fillStyle = "#111";
    x.font = "38px Arial";
    x.textAlign = "center";
    x.direction = "rtl";

    const descLines =
      wrapText(
        x,
        desc,
        840,
        3
      );

    const lineHeight = 48;

    const startY =
      400 -
      ((descLines.length - 1) * lineHeight / 2);


    descLines.forEach((text,index)=>{

      x.fillText(
        text,
        540,
        startY + index * lineHeight
      );

    });


    /* صورة المنتج */

    const px = 120;
    const py = 520;
    const pw = 840;
    const ph = 1000;

    const scale =
      Math.min(
        pw / product.width,
        ph / product.height
      );

    const w =
      product.width * scale;

    const h =
      product.height * scale;


    x.drawImage(
      product,
      px + (pw-w)/2,
      py + (ph-h)/2,
      w,
      h
    );


    /* مربع رقم القطعة */

    x.fillStyle = "#000";
    x.beginPath();

    x.roundRect(
      375,
      1600,
      330,
      180,
      35
    );

    x.fill();


    /* عبارة رقم القطعة */

    x.fillStyle = "#fff";
    x.textAlign = "center";
    x.direction = "rtl";

    x.font = "38px Arial";

    x.fillText(
      "رقم القطعة",
      540,
      1660
    );


    /* رقم القطعة */

    x.font = "bold 48px Arial";

    x.fillText(
      code,
      540,
      1730
    );


    URL.revokeObjectURL(productURL);

  }catch(error){

    console.error(error);

    alert(
      "حدث خطأ أثناء إنشاء التصميم"
    );
  }
}


function save(){
  const canvas = document.getElementById("canvas");

  canvas.toBlob(blob => {
    if(!blob){
      alert("أنشئ التصميم أولاً");
      return;
    }

    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "design.png";

    document.body.appendChild(a);
    a.click();
    a.remove();

    setTimeout(() => URL.revokeObjectURL(a.href), 1000);

  }, "image/png");
}

</script>

</body>
</html>
