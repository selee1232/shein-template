<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة تصميم ShineMe2200 🤖⚡</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #f0f2f5; padding: 15px; text-align: center; margin: 0; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; margin-bottom: 20px; color: #333; font-weight: 800; font-size: 22px; }
        .api-key-box { background: #fdf5e6; padding: 10px; border-radius: 8px; border: 1px dashed #f5b041; margin-bottom: 15px; text-align: right; }
        .api-key-box input { width: 100%; padding: 8px; font-family: monospace; font-size: 12px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; margin-top: 5px; }
        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; text-align: right; margin-bottom: 15px; }
        .input-group { margin-bottom: 0; }
        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 13px; color: #555; }
        input[type="file"], input[type="text"] { width: 100%; padding: 8px; font-family: 'Cairo', sans-serif; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 13px; }
        .ai-btn { background: #1a73e8; color: white; border: none; padding: 5px 8px; border-radius: 5px; font-family: 'Cairo', sans-serif; font-size: 11px; cursor: pointer; float: left; margin-top: -3px; font-weight: bold; }
        .ai-btn:disabled { background: #ccc; cursor: not-allowed; }
        .watermark-toggle { text-align: right; margin-bottom: 15px; font-size: 14px; font-weight: 600; color: #444; display: flex; align-items: center; gap: 5px; cursor: pointer; }
        .watermark-toggle input { transform: scale(1.2); accent-color: #222; }
        .btn-generate { background: #222; color: white; cursor: pointer; border: none; font-weight: bold; padding: 12px; width: 100%; border-radius: 8px; font-size: 16px; font-family: 'Cairo', sans-serif; }
        .btn-convert { background: #25d366; color: white; cursor: pointer; border: none; font-weight: bold; padding: 12px; width: 100%; border-radius: 8px; font-size: 16px; font-family: 'Cairo', sans-serif; margin-top: 15px; display: none; }
        .instruction { color: #d93025; font-size: 13px; font-weight: bold; margin-top: 10px; display: none; }
        .editor-container { margin-top: 15px; border-radius: 10px; overflow: hidden; border: 1px solid #ddd; position: relative; }
        canvas { width: 100%; display: none; cursor: move; }
        img#finalImg { width: 100%; display: none; border-radius: 10px; }
        .sliders-container { display: none; margin-top: 15px; background: #fafafa; padding: 15px; border-radius: 8px; border: 1px solid #eee; text-align: right; }
        .sliders-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 10px; }
        input[type="range"] { width: 100%; accent-color: #222; margin-top: 5px; }
        .slider-label { font-size: 12px; font-weight: 600; text-align: center; display: block; }
    </style>
</head>
<body>

<div class="container">
    <h2>أداة ShineMe2200 🪄</h2>

    <div class="api-key-box">
        <label>🔑 مفتاح الذكاء الاصطناعي (Gemini API):</label>
        <input type="password" id="apiKeyInput" placeholder="الصق المفتاح هنا..." onchange="saveApiKey()">
    </div>
    
    <div class="input-grid">
        <div class="input-group">
            <label>1. الخلفية البيج:</label>
            <input type="file" id="bgInput" accept="image/*">
        </div>
        <div class="input-group">
            <label>2. صورة المنتج:</label>
            <input type="file" id="productInput" accept="image/*">
        </div>
        <div class="input-group">
            <label>
                3. الوصف (عبر الذكاء الاصطناعي):
                <button type="button" class="ai-btn" id="aiGenBtn" onclick="autoGenerateDesc()">🤖 توليد ذكي</button>
            </label>
            <input type="text" id="descInput" placeholder="اكتب أو اضغط زر التوليد">
        </div>
        <div class="input-group">
            <label>4. رقم القطعة:</label>
            <input type="text" id="codeInput" placeholder="مثال: JP5C6H4">
        </div>
    </div>

    <label class="watermark-toggle">
        <input type="checkbox" id="wmToggle" checked onchange="drawScene()">
        ✨ تفعيل العلامة المائية (@shineme2200)
    </label>

    <button class="btn-generate" onclick="initEditor()">1. معاينة وتحريك النصوص 🖱️</button>
    
    <div id="slidersGroup" class="sliders-container">
        <div class="sliders-grid">
            <div>
                <span class="slider-label" style="color: #0b57d0;">🔍 الحجم:</span>
                <input type="range" id="scaleSlider" min="50" max="150" value="100" oninput="updateBlend()">
            </div>
            <div>
                <span class="slider-label" style="color: #d93025;">🎚️ الدمج:</span>
                <input type="range" id="blendSlider" min="0" max="100" value="50" oninput="updateBlend()">
            </div>
        </div>
        <div>
            <span class="slider-label" style="color: #1a73e8;">↕️ تحريك المنتج (لإخفاء الفراغ):</span>
            <input type="range" id="ySlider" min="-800" max="800" value="0" oninput="updateBlend()">
        </div>
    </div>

    <button id="convertBtn" class="btn-convert" onclick="convertToImage()">2. اعتماد (حفظ في الاستديو) 📥</button>
    <p id="saveInstruction" class="instruction">اضغط ضغطة مطولة على الصورة بالأسفل ثم اختر "حفظ في الصور"</p>

    <div class="editor-container">
        <canvas id="canvas" width="1080" height="1920"></canvas>
        <img id="finalImg" alt="التصميم النهائي">
    </div>
</div>

<script>
    document.fonts.load("10pt 'Cairo'");

    window.onload = () => {
        const savedKey = localStorage.getItem('shineme_gemini_key');
        if (savedKey) document.getElementById('apiKeyInput').value = savedKey;
    };

    function saveApiKey() {
        const key = document.getElementById('apiKeyInput').value;
        localStorage.setItem('shineme_gemini_key', key.trim());
    }

    async function autoGenerateDesc() {
        const fileInput = document.getElementById('productInput');
        const apiKey = document.getElementById('apiKeyInput').value.trim();
        const aiBtn = document.getElementById('aiGenBtn');

        if (!apiKey) { alert('الرجاء وضع مفتاح API أولاً!'); return; }
        if (!fileInput.files.length) { alert('الرجاء رفع صورة المنتج أولاً لتتم قراءتها!'); return; }

        aiBtn.innerText = "⏳ جاري التفكير...";
        aiBtn.disabled = true;

        try {
            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.readAsDataURL(file);
            
            reader.onload = function (event) {
                const img = new Image();
                img.onload = async function() {
                    const tempCanvas = document.createElement('canvas');
                    const MAX_SIZE = 400; 
                    let width = img.width; let height = img.height;
                    
                    if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } } 
                    else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } }
                    
                    tempCanvas.width = width; tempCanvas.height = height;
                    const tCtx = tempCanvas.getContext('2d'); tCtx.drawImage(img, 0, 0, width, height);
                    const base64Image = tempCanvas.toDataURL('image/jpeg', 0.6).split(',')[1];
                    
                    const prompt = "أنت صانع محتوى سعودي مبدع. اكتب جملة تسويقية عفوية بالعامية السعودية (من 5 إلى 9 كلمات) توضح فائدة المنتج كأنك تنصح صديق. ممنوع استخدام أسلوب الأمر المباشر (مثل: اطلب، اشتر، احصل، ريح راسك). اكتب الجملة مباشرة بدون مقدمات أو علامات ترقيم.";

                    const requestBody = {
                        contents: [{
                            parts: [
                                { text: prompt },
                                { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                            ]
                        }],
                        generationConfig: {
                            temperature: 1.05
                        }
                    };

                    const modelsToTry = [
                        'models/gemini-3.8-flash',
                        'models/gemini-3.1-flash-preview',
                        'models/gemini-3-flash-preview'
                    ];

                    let success = false;
                    let lastError = "";

                    for (const modelName of modelsToTry) {
                        try {
                            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/${modelName}:generateContent?key=${apiKey}`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(requestBody)
                            });

                            const data = await response.json();
                            if (data.error) throw new Error(data.error.message);

                            const generatedText = data.candidates[0].content.parts[0].text.trim();
                            document.getElementById('descInput').value = generatedText;
                            
                            if (document.getElementById('canvas').style.display === 'block') { drawScene(); }
                            
                            success = true;
                            break; 
                        } catch (err) {
                            lastError = err.message;
                        }
                    }

                    if (!success) {
                        alert("تفاصيل الخطأ: " + lastError);
                    }
                    
                    aiBtn.innerText = "🤖 توليد ذكي";
                    aiBtn.disabled = false;
                };
                img.src = event.target.result;
            };
        } catch (error) {
            alert("حدث خطأ: " + error.message);
            aiBtn.innerText = "🤖 توليد ذكي";
            aiBtn.disabled = false;
        }
    }

    const canvas = document.getElementById('canvas'); const ctx = canvas.getContext('2d');
    const bgLayer = document.createElement('canvas'); bgLayer.width = 1080; bgLayer.height = 1920;
    const bgCtx = bgLayer.getContext('2d');
    let bgImage = new Image(); let productImage = new Image();

    document.getElementById('bgInput').addEventListener('change', e => { if(e.target.files[0]) bgImage.src = URL.createObjectURL(e.target.files[0]); });
    document.getElementById('productInput').addEventListener('change', e => { if(e.target.files[0]) productImage.src = URL.createObjectURL(e.target.files[0]); });

    let elements = { desc: { x: 540, y: 530, scale: 1 }, code: { x: 540, y: 700, scale: 1 }, watermark: { x: 250, y: 1000, scale: 1 } };
    let activeObj = null; let offsetX = 0; let offsetY = 0; let initialDistance = 0; let initialScale = 1;

    function drawWrappedText(context, text, maxWidth, lineHeight) {
        let words = text.split(' '); let line = ''; let lines = [];
        for(let n = 0; n < words.length; n++) { let testLine = line + words[n] + ' '; let metrics = context.measureText(testLine);
            if (metrics.width > maxWidth && n > 0) { lines.push(line.trim()); line = words[n] + ' '; } else { line = testLine; } }
        lines.push(line.trim());
        let startY = -((lines.length - 1) * lineHeight) / 2;
        for(let i = 0; i < lines.length; i++){ context.fillText(lines[i], 0, startY + (i * lineHeight)); } return lines.length;
    }

    function countLines(text) {
        ctx.font = '800 65px "Cairo"'; let words = text.split(' '); let line = ''; let count = 1;
        for(let n = 0; n < words.length; n++) { let testLine = line + words[n] + ' '; let metrics = ctx.measureText(testLine);
            if (metrics.width > 1080 * 0.85 && n > 0) { count++; line = words[n] + ' '; } else { line = testLine; } } return count;
    }

    function updateBlend() {
        if(!bgImage.src || !productImage.src) return; bgCtx.clearRect(0, 0, 1080, 1920);
        let pAspect = productImage.width / productImage.height; let baseHeight = 1920 * 0.65; let baseWidth = baseHeight * pAspect;
        if (baseWidth < 1080) { baseWidth = 1080; baseHeight = baseWidth / pAspect; }
        let productScale = document.getElementById('scaleSlider').value / 100; let drawWidth = baseWidth * productScale; let drawHeight = baseHeight * productScale;
        let dx = (1080 - drawWidth) / 2; let yOffset = parseInt(document.getElementById('ySlider').value); let dy = (1920 - drawHeight) + yOffset; 
        bgCtx.drawImage(productImage, dx, dy, drawWidth, drawHeight);

        const maskCanvas = document.createElement('canvas'); maskCanvas.width = 1080; maskCanvas.height = 1920; const mCtx = maskCanvas.getContext('2d');
        let bAspect = bgImage.width / bgImage.height; let bDrawHeight = 1920; let bDrawWidth = bDrawHeight * bAspect;
        if (bDrawWidth < 1080) { bDrawWidth = 1080; bDrawHeight = bDrawWidth / bAspect; }
        let bx = (1080 - bDrawWidth) / 2; mCtx.drawImage(bgImage, bx, 0, bDrawWidth, bDrawHeight); mCtx.globalCompositeOperation = 'destination-out';
        let sliderVal = document.getElementById('blendSlider').value; let topStop = (100 - sliderVal) / 100 * 0.8; let bottomStop = topStop + 0.3; 
        const gradient = mCtx.createLinearGradient(0, 1920 * topStop, 0, 1920 * bottomStop);
        gradient.addColorStop(0, 'rgba(0,0,0,0)'); gradient.addColorStop(1, 'rgba(0,0,0,1)'); mCtx.fillStyle = gradient; mCtx.fillRect(0, 0, 1080, 1920);
        bgCtx.drawImage(maskCanvas, 0, 0); drawScene();
    }

    function initEditor() {
        if(!bgImage.src || !productImage.src) { alert("تأكد من رفع الصورتين!"); return; }
        document.getElementById('finalImg').style.display = 'none'; document.getElementById('saveInstruction').style.display = 'none';
        canvas.style.display = 'block'; document.getElementById('convertBtn').style.display = 'block'; document.getElementById('slidersGroup').style.display = 'block';
        let descText = document.getElementById('descInput').value; let lines = countLines(descText || " ");
        elements.desc = { x: 540, y: 530, scale: 1 }; elements.code = { x: 540, y: 530 + (lines * 95) - 10, scale: 1 }; elements.watermark = { x: 250, y: 1000, scale: 1 }; updateBlend();
    }

    function drawScene() {
        if(!bgImage.src || !productImage.src) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.drawImage(bgLayer, 0, 0);
        const desc = document.getElementById('descInput').value; const code = document.getElementById('codeInput').value; const showWatermark = document.getElementById('wmToggle').checked;
        ctx.textBaseline = 'middle'; ctx.direction = 'rtl';
        ctx.save(); ctx.translate(elements.desc.x, elements.desc.y); ctx.scale(elements.desc.scale, elements.desc.scale); ctx.font = '800 65px "Cairo"'; ctx.fillStyle = '#000000'; ctx.textAlign = 'center'; drawWrappedText(ctx, desc, 1080 * 0.85, 95); ctx.restore();
        ctx.save(); ctx.translate(elements.code.x, elements.code.y); ctx.scale(elements.code.scale, elements.code.scale); ctx.font = '600 55px "Cairo"'; ctx.fillStyle = '#000000'; ctx.textAlign = 'center'; ctx.fillText("رقم القطعة: " + code, 0, 0); ctx.restore();
        if(showWatermark) { ctx.save(); ctx.translate(elements.watermark.x, elements.watermark.y); ctx.scale(elements.watermark.scale, elements.watermark.scale); ctx.font = '600 45px "Cairo"'; ctx.fillStyle = 'rgba(0, 0, 0, 0.35)'; ctx.textAlign = 'center'; ctx.direction = 'ltr'; ctx.fillText('@shineme2200', 0, 0); ctx.restore(); }
    }

    function getTouchPos(touch) { let rect = canvas.getBoundingClientRect(); let scaleX = canvas.width / rect.width; let scaleY = canvas.height / rect.height; return { x: (touch.clientX - rect.left) * scaleX, y: (touch.clientY - rect.top) * scaleY }; }
    function getDistance(touch1, touch2) { let dx = touch1.clientX - touch2.clientX; let dy = touch1.clientY - touch2.clientY; return Math.sqrt(dx * dx + dy * dy); }
    function detectHit(pos) { const showWatermark = document.getElementById('wmToggle').checked;
        if (showWatermark && Math.abs(pos.x - elements.watermark.x) < 200 * elements.watermark.scale && Math.abs(pos.y - elements.watermark.y) < 100 * elements.watermark.scale) return 'watermark';
        if (Math.abs(pos.x - elements.code.x) < 350 * elements.code.scale && Math.abs(pos.y - elements.code.y) < 100 * elements.code.scale) return 'code';
        if (Math.abs(pos.x - elements.desc.x) < 450 * elements.desc.scale && Math.abs(pos.y - elements.desc.y) < 200 * elements.desc.scale) return 'desc'; return null; }

    canvas.addEventListener('touchstart', function(e) { if(document.getElementById('finalImg').style.display === 'block') return;
        if (e.touches.length === 1) { let pos = getTouchPos(e.touches[0]); activeObj = detectHit(pos); if (activeObj) { offsetX = pos.x - elements[activeObj].x; offsetY = pos.y - elements[activeObj].y; } }
        else if (e.touches.length === 2 && activeObj) { initialDistance = getDistance(e.touches[0], e.touches[1]); initialScale = elements[activeObj].scale; } }, {passive: false});
    canvas.addEventListener('touchmove', function(e) { if (!activeObj) return; e.preventDefault();
        if (e.touches.length === 1) { let pos = getTouchPos(e.touches[0]); elements[activeObj].x = pos.x - offsetX; elements[activeObj].y = pos.y - offsetY; drawScene(); }
        else if (e.touches.length === 2) { let currentDistance = getDistance(e.touches[0], e.touches[1]); elements[activeObj].scale = initialScale * (currentDistance / initialDistance); drawScene(); } }, {passive: false});
    canvas.addEventListener('touchend', function(e) { if (e.touches.length === 0) activeObj = null; });
    canvas.addEventListener('mousedown', function(e) { let pos = getTouchPos(e); activeObj = detectHit(pos); if(activeObj) { offsetX = pos.x - elements[activeObj].x; offsetY = pos.y - elements[activeObj].y; } });
    canvas.addEventListener('mousemove', function(e) { if(activeObj && e.buttons === 1) { let pos = getTouchPos(e); elements[activeObj].x = pos.x - offsetX; elements[activeObj].y = pos.y - offsetY; drawScene(); } });
    window.addEventListener('mouseup', function() { activeObj = null; });

    async function convertToImage() { const dataURL = canvas.toDataURL('image/png', 1.0);
        const executePlanB = () => { const imgEl = document.getElementById('finalImg'); imgEl.src = dataURL; canvas.style.display = 'none'; imgEl.style.display = 'block'; document.getElementById('convertBtn').style.display = 'none'; document.getElementById('slidersGroup').style.display = 'none'; document.getElementById('saveInstruction').style.display = 'block'; };
        if (!navigator.share) { executePlanB(); return; }
        try { let arr = dataURL.split(','), mime = arr[0].match(/:(.*?);/)[1]; let bstr = atob(arr[1]), n = bstr.length, u8arr = new Uint8Array(n); while(n--){ u8arr[n] = bstr.charCodeAt(n); }
            const blob = new Blob([u8arr], {type:mime}); const file = new File([blob], 'Shineme2200_Product.png', { type: 'image/png' });
            if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'تصميم ShineMe2200' }); } else { executePlanB(); } } catch (err) { executePlanB(); } }
</script>
</body>
</html>
