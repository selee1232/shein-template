const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),productInput=document.getElementById('product'),contentInput=document.getElementById('content'),generateBtn=document.getElementById('generate'),downloadBtn=document.getElementById('download'),statusEl=document.getElementById('status');
let bgImage=new Image(),productImage=null,bgReady=false;bgImage.onload=()=>{bgReady=true;drawBackgroundOnly()};bgImage.src=BG_DATA;
function roundedRect(c,x,y,w,h,r){const q=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+q,y);c.arcTo(x+w,y,x+w,y+h,q);c.arcTo(x+w,y+h,x,y+h,q);c.arcTo(x,y+h,x,y,q);c.arcTo(x,y,x+w,y,q);c.closePath()}
function drawBackgroundOnly(){ctx.clearRect(0,0,1080,1920);ctx.drawImage(bgImage,0,0,1080,1920)}
function loadFileImage(file){return new Promise((ok,no)=>{const r=new FileReader();r.onload=e=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=e.target.result};r.onerror=no;r.readAsDataURL(file)})}
function parseText(raw){const lines=raw.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);if(lines.length<3)throw new Error('اكتب عنوانًا ووصفًا ورقم قطعة');return{title:lines[0],description:lines.slice(1,-1).join(' '),code:lines.at(-1)}}
function fitFont(text,max,start,min,weight='700'){let s=start;while(s>min){ctx.font=`${weight} ${s}px Arial,Tahoma,sans-serif`;if(ctx.measureText(text).width<=max)break;s-=2}return s}
function wrapText(text,maxWidth,maxLines,start,min,weight='400'){for(let size=start;size>=min;size-=2){ctx.font=`${weight} ${size}px Arial,Tahoma,sans-serif`;const words=text.split(/\s+/),lines=[];let line='';for(const word of words){const test=line?line+' '+word:word;if(ctx.measureText(test).width<=maxWidth)line=test;else{if(line)lines.push(line);line=word}}if(line)lines.push(line);if(lines.length<=maxLines)return{size,lines}}return{size:min,lines:[text]}}
function getContainSize(img,maxW,maxH){const s=Math.min(maxW/img.width,maxH/img.height);return{w:img.width*s,h:img.height*s}}
function drawPoster(d){
  drawBackgroundOnly();

  // 1) العنوان: يبقى فوق الوصف مباشرة
  const titleY=300;
  const titleGap=20;
  let ts=fitFont(d.title,860,64,42,'700');
  ctx.save();
  ctx.direction='rtl';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font=`700 ${ts}px Arial,Tahoma,sans-serif`;ctx.fillStyle='#e91e63';
  ctx.fillText(d.title,540,titleY);
  ctx.restore();

  // 2) الوصف: من سطر إلى 3 أسطر، وينتهي مباشرة قبل الصورة
  const wr=wrapText(d.description,800,3,40,30,'400');
  const descLineH=Math.max(48,Math.round(wr.size*1.35));
  const titleBottom=titleY+ts/2;
  const descTop=titleBottom+titleGap;
  const descFirstY=descTop+descLineH/2;
  ctx.save();
  ctx.direction='rtl';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font=`400 ${wr.size}px Arial,Tahoma,sans-serif`;ctx.fillStyle='#111';
  wr.lines.forEach((line,i)=>ctx.fillText(line,540,descFirstY+i*descLineH));
  ctx.restore();
  const descBottom=descTop+wr.lines.length*descLineH;

  // 3) الصورة: تتحرك حسب ارتفاع الوصف، وتُعرض كاملة بدون قص
  const imageGap=22;
  const imageTop=descBottom+imageGap;
  const sidePadding=118;
  const framePad=14;
  const maxFrameW=844;
  const maxImageW=(maxFrameW-framePad*2)*0.85; // تصغير عرض الصورة 15%
  const maxImageBottom=1565; // نحجز المساحة اللازمة لمربع رقم القطعة والفوتر
  const maxFrameH=Math.max(260,maxImageBottom-imageTop);
  const maxImageH=Math.max(232,(maxFrameH-framePad*2)*0.85); // تصغير ارتفاع الصورة 15%
  const sz=getContainSize(productImage,maxImageW,maxImageH);
  const fw=sz.w+framePad*2,fh=sz.h+framePad*2;
  const fx=(1080-fw)/2,fy=imageTop;

  ctx.save();
  roundedRect(ctx,fx,fy,fw,fh,48);ctx.fillStyle='#fff';ctx.fill();ctx.clip();
  ctx.drawImage(productImage,fx+framePad,fy+framePad,sz.w,sz.h);
  ctx.restore();

  // 4) مربع رقم القطعة: دائمًا تحت الصورة مباشرة مهما تغيّر ارتفاع الصورة
  const codeGap=22;
  const bw=410,bh=125,bx=(1080-bw)/2,by=fy+fh+codeGap;
  ctx.save();
  roundedRect(ctx,bx,by,bw,bh,28);ctx.fillStyle='#000';ctx.fill();
  ctx.direction='rtl';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';
  ctx.font='400 32px Arial,Tahoma,sans-serif';ctx.fillText('رقم القطعة',540,by+32);
  let cs=fitFont(d.code,bw-56,44,32,'700');ctx.font=`700 ${cs}px Arial,Tahoma,sans-serif`;
  ctx.fillText(d.code,540,by+84);ctx.restore();

  // 5) الجملة السفلية: مرتبطة بمربع رقم القطعة وتتحرك معه تلقائيًا
  // المسافة أكبر قليلًا من المسافة بين العنوان والوصف
  const footerGap=28;
  const footerY=by+bh+footerGap;
  ctx.save();
  ctx.direction='rtl';
  ctx.textAlign='left';
  ctx.textBaseline='top';
  ctx.fillStyle='#111';
  ctx.font='700 31px Arial,Tahoma,sans-serif';
  ctx.fillText('🌸 للوصول السريع ابحثي برقم القطعة',92,footerY);
  ctx.restore();
}
generateBtn.onclick=async()=>{try{statusEl.textContent='';if(!bgReady)throw Error('انتظر تحميل الخلفية');const f=productInput.files[0];if(!f)throw Error('اختر صورة المنتج');const d=parseText(contentInput.value);productImage=await loadFileImage(f);drawPoster(d);downloadBtn.disabled=false;statusEl.textContent='تم إنشاء التصميم'}catch(e){statusEl.textContent=e.message||'حدث خطأ'}};
downloadBtn.onclick=()=>{const a=document.createElement('a');a.download='shineme-product.png';a.href=canvas.toDataURL('image/png');a.click()};
</script></body></html>
